name: Verified snowpack refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '37 6,18 * * *'
concurrency:
  group: snowpack-production
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  refresh:
    if: github.event.repository.private == false && vars.SNOWPACK_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: source
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: data-state
          path: history
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
        working-directory: source
      - name: Validate and prepare last-good site
        id: refresh
        continue-on-error: true
        working-directory: source
        run: python -m pipeline.run --store ../history/snowpack.sqlite --output dist
        env:
          SIGNUP_ENABLED: ${{ vars.SIGNUP_ENABLED }}
          SIGNUP_SERVICE_URL: ${{ vars.SIGNUP_SERVICE_URL }}
      - name: Persist accepted history and attempt status
        working-directory: history
        run: |
          test $(stat -c%s snowpack.sqlite) -lt 80000000
          git config user.name 'snowpack automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f snowpack.sqlite
          if ! git diff --cached --quiet; then
            git commit -m 'Persist verified snowpack history'
            git push origin HEAD:data-state
          fi
      - name: Enforce small publication
        run: |
          test -f source/dist/index.html
          test $(du -sb source/dist | cut -f1) -lt 90000000
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: source/dist
          retention-days: 1
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Surface rejected update after preserving last-good site
        if: steps.refresh.outcome != 'success'
        run: exit 1
