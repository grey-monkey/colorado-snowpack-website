name: Colorado Snowpack Weekly
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate and validate without sending'
        type: boolean
        default: true
  schedule:
    - cron: '17 15 * * 1'
permissions:
  contents: read
concurrency:
  group: snowpack-weekly
  cancel-in-progress: false
jobs:
  weekly:
    if: vars.WEEKLY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: source
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: data-state
          path: history
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
        working-directory: source
      - run: python -m ops.send_weekly
        working-directory: source
        env:
          SNOWPACK_STORE: ../history/snowpack.sqlite
          WEEKLY_ENABLED: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
          SIGNUP_SERVICE_URL: ${{ vars.SIGNUP_SERVICE_URL }}
          AUTOMATION_SECRET: ${{ secrets.AUTOMATION_SECRET }}
